<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>藥師作業區 - 住院藥局收發系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .nav-tabs .nav-link.active {
      background-color: #cfe2ff !important; /* Bootstrap 淺藍色 */
      border-color: #0d6efd #0d6efd #cfe2ff !important;
      color: #084298 !important;
      font-weight: bold;
    }
    .nav-tabs .nav-link { background-color: #f8f9fa; color: #6c757d; }
  </style>
</head>
<body class="bg-light">

  <!-- 頂部導覽列與登出 -->
  <nav class="navbar navbar-dark bg-primary mb-3 shadow-sm px-3">
    <div class="d-flex align-items-center">
      <span class="navbar-brand mb-0 h1 fs-3"><i class="bi bi-capsule me-2"></i>藥師作業專區</span>
      <span class="text-white fs-4 ms-4">目前登入：<strong id="displayPharma">載入中...</strong></span>
    </div>
    <button class="btn btn-outline-light btn-lg" onclick="logout()">登出</button>
  </nav>

  <div class="container-fluid px-4">
    <!-- 上方切換頁籤 (Tab) -->
    <ul class="nav nav-tabs nav-fill mb-4 fs-4" id="pharmaTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="doc-receive-tab" data-bs-toggle="tab" data-bs-target="#docReceive" type="button" role="tab">
          📥 文件收單作業 <span class="badge bg-danger rounded-pill ms-2" id="pendingDocCount">0</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <!-- 預留氣送作業分頁 -->
        <button class="nav-link" id="pneumatic-tab" data-bs-toggle="tab" data-bs-target="#pneumatic" type="button" role="tab">
          🚀 氣送作業管理
        </button>
      </li>
    </ul>

    <!-- 頁籤內容區 -->
    <div class="tab-content" id="pharmaTabContent">
      
      <!-- 第一頁籤：文件收單作業 -->
      <div class="tab-pane fade show active" id="docReceive" role="tabpanel">
        <div class="row">
          <!-- 左側：待處理的送件單 -->
          <div class="col-lg-6 mb-4">
            <div class="card shadow border-warning h-100">
              <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center py-3">
                <h4 class="m-0 fw-bold"><i class="bi bi-inbox me-2"></i>待收單列表</h4>
                <button class="btn btn-light btn-sm fw-bold" id="btnRefreshPending"><i class="bi bi-arrow-clockwise"></i> 重整</button>
              </div>
              <div class="card-body bg-light" id="pendingContainer" style="height: 650px; overflow-y: auto;">
                <div class="text-muted text-center py-5 fs-4">資料讀取中...</div>
              </div>
            </div>
          </div>

          <!-- 右側：已處理/待領回清單 -->
          <div class="col-lg-6">
            <div class="card shadow border-primary h-100">
              <div class="card-header bg-primary text-white py-3">
                <h4 class="m-0 fw-bold"><i class="bi bi-check2-circle me-2"></i>今日已收單紀錄</h4>
              </div>
              <div class="card-body" id="completedContainer" style="height: 650px; overflow-y: auto;">
                <div class="text-muted text-center py-5 fs-4">資料讀取中...</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 第二頁籤：氣送作業 (開發中) -->
      <div class="tab-pane fade" id="pneumatic" role="tabpanel">
        <div class="card shadow p-5 text-center mt-5">
          <i class="bi bi-rocket-takeoff text-primary display-1 mb-3"></i>
          <h2 class="text-muted fw-bold">氣送作業模組開發中...</h2>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/pharmacist.js"></script>
</body>
</html>
