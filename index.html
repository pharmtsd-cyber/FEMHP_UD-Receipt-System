<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歷史收發總表 - 住院藥局收發系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    .nav-tabs .nav-link.active { font-weight: bold; background-color: #e9ecef !important; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-secondary mb-4 shadow-sm px-3">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 fs-3"><i class="bi bi-clock-history me-2"></i>歷史收發查詢大廳</span>
      <a href="index.html" class="btn btn-outline-light">← 返回首頁</a>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="card shadow">
      <div class="card-body p-4">
        
        <!-- 日期選擇區 -->
        <div class="row justify-content-center mb-4 border-bottom pb-4">
          <div class="col-md-4 text-center">
            <label class="fw-bold fs-4 mb-2 text-primary">選擇查詢日期：</label>
            <input type="date" id="queryDate" class="form-control form-control-lg text-center fw-bold text-primary">
          </div>
        </div>

        <ul class="nav nav-tabs nav-fill mb-4 fs-4" id="recordTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active text-success" id="med-tab" data-bs-toggle="tab" data-bs-target="#med" type="button">📦 出院帶藥紀錄</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link text-primary" id="doc-tab" data-bs-toggle="tab" data-bs-target="#doc" type="button">📄 文件收發紀錄</button>
          </li>
        </ul>

        <div class="tab-content" id="recordTabContent">
          <!-- 帶藥區 -->
          <div class="tab-pane fade show active" id="med" role="tabpanel">
            <div class="table-responsive">
              <table class="table table-hover table-striped align-middle fs-5">
                <thead class="table-success">
                  <tr><th>序號</th><th>領藥號</th><th>病歷號</th><th>處方日期</th><th>簽收人</th><th>簽收時間</th></tr>
                </thead>
                <tbody id="medRecordsBody"></tbody>
              </table>
            </div>
          </div>
          <!-- 文件區 -->
          <div class="tab-pane fade" id="doc" role="tabpanel">
            <div class="table-responsive">
              <table class="table table-hover table-striped align-middle fs-5">
                <thead class="table-primary">
                  <tr><th>狀態</th><th>類型</th><th>病房床號</th><th>病歷號</th><th>送件人</th><th>藥師/處置</th></tr>
                </thead>
                <tbody id="docRecordsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dateInput = document.getElementById('queryDate');
      dateInput.value = new Date().toISOString().split('T')[0]; // 預設今天
      
      dateInput.addEventListener('change', loadRecords);
      loadRecords(); // 初始載入
    });

    async function loadRecords() {
      const dateStr = document.getElementById('queryDate').value;
      if(!dateStr) return;

      const medBody = document.getElementById('medRecordsBody');
      const docBody = document.getElementById('docRecordsBody');
      medBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">讀取中...</td></tr>';
      docBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">讀取中...</td></tr>';

      // 1. 抓出院帶藥
      const medRes = await callGAS('getDailyRecords', { date: dateStr });
      if (medRes.success && medRes.data.length > 0) {
        medBody.innerHTML = medRes.data.map((r, i) => `<tr><td>${i+1}</td><td class="text-success fw-bold">${r.dispNo}</td><td>${r.chartNo}</td><td>${r.rxDate}</td><td>${r.staffName}</td><td>${r.time}</td></tr>`).join('');
      } else {
        medBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">該日無帶藥紀錄</td></tr>`;
      }

      // 2. 抓文件收發
      const docRes = await callGAS('getPublicDocRecords', { date: dateStr });
      if (docRes.success && docRes.data.length > 0) {
        docBody.innerHTML = docRes.data.map((r) => `
          <tr>
            <td><span class="badge bg-secondary">${r.status}</span></td>
            <td class="fw-bold">${r.type}</td>
            <td>${r.ward || '-'}</td>
            <td>${r.chartNo || '-'}</td>
            <td>${r.sender}</td>
            <td>${r.pharmaName} <br><small class="text-danger">${r.replyOption}</small></td>
          </tr>
        `).join('');
      } else {
        docBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">該日無文件收發紀錄</td></tr>`;
      }
    }
  </script>
</body>
</html>
