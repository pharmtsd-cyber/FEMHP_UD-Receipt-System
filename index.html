<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>住院藥局收發系統 - 首頁</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    .portal-card { transition: transform 0.2s; cursor: pointer; }
    .portal-card:hover { transform: translateY(-5px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
  </style>
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container text-center">
    <h1 class="mb-5 text-primary fw-bold"><i class="bi bi-hospital me-2"></i>住院藥局收發系統</h1>
    
    <div class="row justify-content-center gap-3">
      
      <!-- 第一個入口：傳送人員 -->
      <div class="col-md-3">
        <div class="card shadow-sm portal-card h-100 py-4 border-success" onclick="location.href='transport_login.html'">
          <div class="card-body">
            <i class="bi bi-person-walking display-1 text-success mb-3 d-block"></i>
            <h4 class="card-title text-success fw-bold">傳送人員專區</h4>
            <p class="text-muted mt-3 fs-6">出院帶藥簽收<br>與文件送件</p>
          </div>
        </div>
      </div>

      <!-- 第二個入口：藥師 -->
      <div class="col-md-3">
        <div class="card shadow-sm portal-card h-100 py-4 border-primary" onclick="location.href='pharmacist_login.html'">
          <div class="card-body">
            <i class="bi bi-capsule display-1 text-primary mb-3 d-block"></i>
            <h4 class="card-title text-primary fw-bold">藥師系統登入</h4>
            <p class="text-muted mt-3 fs-6">氣送作業、<br>文件收單與管理</p>
          </div>
        </div>
      </div>

      <!-- 第三個入口：歷史查詢大廳 -->
      <div class="col-md-3">
        <div class="card shadow-sm portal-card h-100 py-4 border-secondary" onclick="location.href='public_records.html'">
          <div class="card-body">
            <i class="bi bi-clock-history display-1 text-secondary mb-3 d-block"></i>
            <h4 class="card-title text-secondary fw-bold">歷史收發查詢</h4>
            <p class="text-muted mt-3 fs-6">免登入！<br>查看所有帶藥與文件紀錄</p>
          </div>
        </div>
      </div>

      <!-- ★ 第四個入口：傳送主管管理專區 -->
      <div class="col-md-3">
        <div class="card shadow-sm portal-card h-100 py-4 border-danger" onclick="location.href='transport_admin.html'">
          <div class="card-body">
            <i class="bi bi-shield-lock display-1 text-danger mb-3 d-block"></i>
            <h4 class="card-title text-danger fw-bold">主管管理專區</h4>
            <p class="text-muted mt-3 fs-6">權限控管！<br>維護傳送人員名單</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
