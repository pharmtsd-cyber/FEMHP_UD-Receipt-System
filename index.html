<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>住院藥局收發系統 - 首頁</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .portal-card { transition: transform 0.2s; cursor: pointer; }
    .portal-card:hover { transform: translateY(-5px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
  </style>
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container text-center">
    <h1 class="mb-5 text-primary fw-bold">🏥 住院藥局收發系統</h1>
    
    <div class="row justify-content-center gap-4">
      <!-- 傳送人員入口 -->
      <div class="col-md-4">
        <div class="card shadow-sm portal-card h-100 py-4" onclick="location.href='transport.html'">
          <div class="card-body">
            <h1 class="display-1 mb-3">🏃‍♂️</h1>
            <h3 class="card-title text-success fw-bold">傳送人員專區</h3>
            <p class="text-muted mt-3">免登入，輸入編號即可進行<br>出院帶藥簽收與文件送件。</p>
          </div>
        </div>
      </div>

      <!-- 藥師入口 -->
      <div class="col-md-4">
        <div class="card shadow-sm portal-card h-100 py-4" onclick="location.href='pharmacist_login.html'">
          <div class="card-body">
            <h1 class="display-1 mb-3">🧑‍⚕️</h1>
            <h3 class="card-title text-primary fw-bold">藥師登入</h3>
            <p class="text-muted mt-3">需輸入帳號密碼，<br>進行氣送作業、文件收單與查詢。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
