<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>藥師登入 - 住院藥局收發系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h2 class="text-primary fw-bold">藥師系統登入</h2>
              <p class="text-muted">請輸入您的員工編號與密碼</p>
            </div>
            
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-bold">員工編號</label>
                <input type="text" class="form-control form-control-lg" id="loginId" required autofocus>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold">密碼</label>
                <input type="password" class="form-control form-control-lg" id="loginPwd" required>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">登 入</button>
            </form>
            
            <div class="text-center mt-4">
              <a href="index.html" class="text-decoration-none text-secondary">← 返回首頁</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pwd = document.getElementById('loginPwd').value.trim();

      if(!id || !pwd) return;

      Swal.fire({ title: '登入中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      // 呼叫 GAS API 進行登入驗證
      const result = await callGAS('pharmacistLogin', { staffId: id, password: pwd });

      if (result.success) {
        // ★ 登入成功：將姓名與員編存入 sessionStorage
        sessionStorage.setItem('pharmaId', result.staffId);
        sessionStorage.setItem('pharmaName', result.name);
        
        Swal.fire({
          icon: 'success',
          title: `歡迎，${result.name} 藥師！`,
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          // 跳轉至藥師工作區 (下一階段開發)
          window.location.href = 'pharmacist_dashboard.html';
        });
      } else {
        Swal.fire('登入失敗', result.message, 'error');
      }
    });
  </script>
</body>
</html>
