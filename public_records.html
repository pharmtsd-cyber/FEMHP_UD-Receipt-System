<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>住院藥局收發紀錄查詢平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    .nav-tabs .nav-link.active { font-weight: bold; background-color: #e9ecef !important; }
    .filter-box { background-color: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #dee2e6; }
    /* 讓折疊內容的底色有些微區分，看起來更整齊 */
    .sub-table-row { background-color: #f8f9fa; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-secondary mb-4 shadow-sm px-3">
    <div class="container-fluid justify-content-center">
      <span class="navbar-brand mb-0 h1 fs-3"><i class="bi bi-search me-2"></i>住院藥局收發紀錄查詢平台</span>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        
        <!-- 頂部：日期區間選擇區 -->
        <div class="row justify-content-center mb-4 border-bottom pb-4 align-items-end">
          <div class="col-md-3">
            <label class="fw-bold fs-5 mb-2 text-primary">開始日期：</label>
            <input type="date" id="startDate" class="form-control form-control-lg text-center fw-bold">
          </div>
          <div class="col-md-3">
            <label class="fw-bold fs-5 mb-2 text-primary">結束日期：</label>
            <input type="date" id="endDate" class="form-control form-control-lg text-center fw-bold">
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="loadRecords()"><i class="bi bi-cloud-download me-2"></i>載入資料</button>
          </div>
        </div>

        <ul class="nav nav-tabs nav-fill mb-4 fs-4" id="recordTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active text-success" id="med-tab" data-bs-toggle="tab" data-bs-target="#med" type="button">📦 出院帶藥 / 氣送紀錄</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link text-primary" id="doc-tab" data-bs-toggle="tab" data-bs-target="#doc" type="button">📄 文件收發紀錄</button>
          </li>
        </ul>

        <div class="tab-content" id="recordTabContent">
          
          <!-- ================= 第一頁籤：帶藥區 ================= -->
          <div class="tab-pane fade show active" id="med" role="tabpanel">
            <div class="filter-box row g-3">
              <div class="col-md-4">
                <input type="text" id="filterMedDisp" class="form-control form-control-lg border-success" placeholder="🔍 搜尋 領藥號 (可輸入片段)...">
              </div>
              <div class="col-md-4">
                <input type="text" id="filterMedChart" class="form-control form-control-lg border-success" placeholder="🔍 搜尋 病歷號...">
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle fs-5 border">
                <thead class="table-success">
                  <tr><th>日期</th><th>領藥號</th><th>病歷號</th><th>總筆數</th><th>操作</th></tr>
                </thead>
                <tbody id="medRecordsBody"></tbody>
              </table>
            </div>
          </div>

          <!-- ================= 第二頁籤：文件區 ================= -->
          <div class="tab-pane fade" id="doc" role="tabpanel">
            <div class="filter-box row g-3">
              <div class="col-md-3">
                <input type="text" id="filterDocType" class="form-control form-control-lg border-primary" placeholder="🔍 搜尋 文件類型...">
              </div>
              <div class="col-md-3">
                <input type="text" id="filterDocChart" class="form-control form-control-lg border-primary" placeholder="🔍 搜尋 病歷號...">
              </div>
              <div class="col-md-3">
                <input type="text" id="filterDocWard" class="form-control form-control-lg border-primary" placeholder="🔍 搜尋 病房床號...">
              </div>
              <div class="col-md-3">
                <input type="text" id="filterDocDisp" class="form-control form-control-lg border-primary" placeholder="🔍 搜尋 附加資訊...">
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover table-striped align-middle fs-5 border">
                <thead class="table-primary">
                  <tr>
                    <th width="15%">日期 / 狀態</th>
                    <th width="15%">文件類型</th>
                    <th width="40%">病房 / 病歷號 / 附加資訊</th>
                    <th width="30%">經手歷程 (人員與時間)</th>
                  </tr>
                </thead>
                <tbody id="docRecordsBody"></tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    let allMedsData = [];
    let allDocsData = [];

    document.addEventListener('DOMContentLoaded', () => {
      // 預設日期為今天
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
      
      // 綁定輸入框過濾事件
      document.getElementById('filterMedDisp').addEventListener('input', renderMeds);
      document.getElementById('filterMedChart').addEventListener('input', renderMeds);
      
      document.getElementById('filterDocType').addEventListener('input', renderDocs);
      document.getElementById('filterDocChart').addEventListener('input', renderDocs);
      document.getElementById('filterDocWard').addEventListener('input', renderDocs);
      document.getElementById('filterDocDisp').addEventListener('input', renderDocs);

      loadRecords(); // 初始載入
    });

    // 1. 向 GAS 要資料 (帶有 payload 格式)
    async function loadRecords() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if(!start || !end) return;

      const medBody = document.getElementById('medRecordsBody');
      const docBody = document.getElementById('docRecordsBody');
      medBody.innerHTML = '<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-success"></div><p class="mt-2">資料讀取中...</p></td></tr>';
      docBody.innerHTML = '<tr><td colspan="4" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">資料讀取中...</p></td></tr>';

      const payload = { startDate: start, endDate: end };

      const [medRes, docRes] = await Promise.all([
        callGAS('getDailyRecords', { payload: payload }),
        callGAS('getPublicDocRecords', { payload: payload })
      ]);

      allMedsData = medRes.success ? medRes.data : [];
      allDocsData = docRes.success ? docRes.data : [];

      renderMeds();
      renderDocs();
    }

    // 2. 渲染出院帶藥表格 (分組、排序、折疊)
    function renderMeds() {
      const dispFilter = document.getElementById('filterMedDisp').value.trim().toLowerCase();
      const chartFilter = document.getElementById('filterMedChart').value.trim().toLowerCase();
      
      // A. 先過濾資料
      const filtered = allMedsData.filter(r => {
        const matchDisp = r.dispNo.toLowerCase().includes(dispFilter);
        const matchChart = r.chartNo.toLowerCase().includes(chartFilter);
        return matchDisp && matchChart;
      });

      const tbody = document.getElementById('medRecordsBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">查無符合條件的紀錄</td></tr>`;
        return;
      }

      // B. 將資料依「領藥號」分組
      const groupedData = {};
      filtered.forEach(r => {
        if (!groupedData[r.dispNo]) {
          groupedData[r.dispNo] = {
            dateStr: r.dateStr,
            chartNo: r.chartNo,
            records: []
          };
        }
        groupedData[r.dispNo].records.push(r);
      });

      // C. 將領藥號由小到大排序 (8開頭的數字排序)
      const sortedDispNos = Object.keys(groupedData).sort((a, b) => {
        // 如果是純數字就用數字排，不然就用字串排
        const numA = parseInt(a, 10);
        const numB = parseInt(b, 10);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
      });

      // D. 生成 HTML (主列 + 隱藏的子清單列)
      let html = '';
      sortedDispNos.forEach((dispNo, index) => {
        const group = groupedData[dispNo];
        const collapseId = `collapseMed_${index}`;
        
        html += `
          <tr>
            <td>${group.dateStr}</td>
            <td class="text-success fw-bold">${dispNo}</td>
            <td>${group.chartNo}</td>
            <td><span class="badge bg-secondary rounded-pill">${group.records.length} 筆</span></td>
            <td>
              <button class="btn btn-outline-success btn-sm fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                詳細紀錄 <i class="bi bi-chevron-down"></i>
              </button>
            </td>
          </tr>
          <!-- 隱藏的子清單 -->
          <tr class="collapse sub-table-row" id="${collapseId}">
            <td colspan="5" class="p-3">
              <table class="table table-sm table-bordered mb-0 bg-white">
                <thead class="table-light">
                  <tr><th>處方日期</th><th>經手人員</th><th>刷入時間</th></tr>
                </thead>
                <tbody>
                  ${group.records.map(sub => `
                    <tr>
                      <td>${sub.rxDate}</td>
                      <td>${sub.staffName}</td>
                      <td>${sub.time}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

// 3. 渲染文件收發表格 (拔除寫死的重複資訊，完全交給動態標籤)
    function renderDocs() {
      const typeFilter = document.getElementById('filterDocType').value.trim().toLowerCase();
      const chartFilter = document.getElementById('filterDocChart').value.trim().toLowerCase();
      const wardFilter = document.getElementById('filterDocWard').value.trim().toLowerCase();
      const dispFilter = document.getElementById('filterDocDisp').value.trim().toLowerCase();
      
      const filtered = allDocsData.filter(r => {
        const matchType = r.type.toLowerCase().includes(typeFilter);
        const matchChart = r.chartNo.toLowerCase().includes(chartFilter);
        const matchWard = r.ward.toLowerCase().includes(wardFilter);
        const matchDisp = r.rawSearchText.toLowerCase().includes(dispFilter);
        return matchType && matchChart && matchWard && matchDisp;
      });

      const tbody = document.getElementById('docRecordsBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">查無符合條件的紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => `
        <tr>
          <td>
            <div class="fw-bold text-secondary mb-1">${r.dateStr}</div>
            <span class="badge ${r.status === '待藥師收單' ? 'bg-warning text-dark' : 'bg-secondary'} fs-6 d-inline-block mb-1">${r.status}</span><br>
            ${r.replyOption ? `<span class="badge bg-primary fs-6">${r.replyOption}</span>` : ''}
          </td>
          
          <td class="fw-bold fs-5 text-dark">${r.type}</td>
          
          <td>
            <!-- ★ 這裡把寫死的重複文字刪除，完全依賴後端傳來的整齊標籤 -->
            <div class="mt-1">${r.detailsHtml}</div>
          </td>
          
          <td>
            <ul class="list-unstyled mb-0 small">
              <li class="mb-1">
                <i class="bi bi-person-walking text-dark me-1"></i>送件: <strong>${r.sender}</strong> 
                <span class="text-muted ms-1">(${r.sendTime})</span>
              </li>
              <li class="mb-1">
                <i class="bi bi-capsule text-primary me-1"></i>收單: <strong class="${r.pharmaName === '等待中' ? 'text-danger' : 'text-primary'}">${r.pharmaName}</strong> 
                ${r.receiveTime ? `<span class="text-muted ms-1">(${r.receiveTime})</span>` : ''}
              </li>
              ${(r.returnerName && r.returnerName !== '系統結案') ? `
              <li>
                <i class="bi bi-check2-circle text-success me-1"></i>領回: <strong class="text-success">${r.returnerName}</strong> 
                ${r.returnTime ? `<span class="text-muted ms-1">(${r.returnTime})</span>` : ''}
              </li>` : ''}
            </ul>
          </td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
